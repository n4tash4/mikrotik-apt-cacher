# Rotation for apt-cacher's access/error logs. Driven by apt-cacher.sh (no
# cron). The package's own logrotate.d entry is removed because its postrotate
# restarts the daemon via invoke-rc.d, which doesn't exist in this container.
#
# copytruncate keeps the daemon's open log descriptors valid, so no restart or
# signal is needed. maxsize bounds growth between the (daily) runs.
/var/log/apt-cacher/*.log {
    weekly
    maxsize 32M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
